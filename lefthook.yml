# Lefthook Git hooks configuration
# https://github.com/evilmartians/lefthook

pre-commit:
  parallel: false
  commands:
    format:
      glob: "*.{js,jsx,ts,tsx,json,css,md}"
      run: bun x oxfmt --write {staged_files}
      stage_fixed: true
    lint:
      glob: "*.{js,jsx,ts,tsx}"
      run: bun x oxlint {staged_files}
    astro-check:
      run: bun run check

commit-msg:
  commands:
    commit-lint:
      run: |
        commit_file="{1}"
        if command -v fluidise-clint >/dev/null 2>&1; then
          fluidise-clint --format text "$commit_file"
        else
          commit_first_line=$(head -n 1 "$commit_file")
          if ! echo "$commit_first_line" | grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9_\-\/]+\))?: .+'; then
            echo "❌ Invalid commit message: '$commit_first_line'"
            echo "Commit message must follow Conventional Commits format, e.g. 'feat: description' or 'fix(scope): description'."
            exit 1
          fi
        fi
