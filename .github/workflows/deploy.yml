name: CI/CD Pipeline

on:
  pull_request:
    branches: [main, 'feat/**']
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Validation, tests et build Docker
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate PR title (Conventional Commits)
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          CONVENTIONAL_REGEX="^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9_.-]+\))?!?: .+"
          if ! echo "$PR_TITLE" | grep -qE "$CONVENTIONAL_REGEX"; then
            echo "❌ PR title does not follow Conventional Commits format:" >&2
            echo "   '$PR_TITLE'" >&2
            echo "Expected: <type>(<scope>): <description> (e.g. docs(brand): add logo assets)" >&2
            exit 1
          fi
          echo "✅ PR title follows Conventional Commits: '$PR_TITLE'"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: '.bun-version'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check code formatting with Oxfmt
        run: bun run format:check

      - name: Lint codebase with Oxlint
        run: bun run lint

      - name: Run unit tests with Vitest
        run: bun run test

      - name: Type check with Astro
        run: bun run check
        env:
          ASTRO_TELEMETRY_DISABLED: 1

      - name: Build static site verification
        run: bun run build
        env:
          ASTRO_TELEMETRY_DISABLED: 1

      - name: Build and verify Docker container
        run: docker build -t fluidise-site-ci .

  auto-merge:
    name: Auto-merge PR
    needs: [check]
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr merge "$PR_URL" --squash --delete-branch

  deploy:
    name: Déploiement en production via Dokploy
    needs: check
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Déclencher le webhook Dokploy
        env:
          DOKPLOY_DEPLOY_URL: ${{ secrets.DOKPLOY_DEPLOY_URL }}
          CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
        run: |
          if [ -z "$DOKPLOY_DEPLOY_URL" ]; then
            echo "::warning::DOKPLOY_DEPLOY_URL n'est pas encore configuré dans l'environnement 'production'. Étape de webhook ignorée jusqu'à configuration des secrets."
            exit 0
          fi

          deploy_token="${DOKPLOY_DEPLOY_URL##*/}"
          echo "::add-mask::$deploy_token"

          payload=$(jq -nc \
            --arg ref "$GITHUB_REF" \
            --arg sha "$GITHUB_SHA" \
            '{ref: $ref, head_commit: {id: $sha, message: "CI passed"}, commits: []}')

          curl --fail --silent --show-error --output /dev/null \
            --request POST \
            --header "CF-Access-Client-Id: $CLOUDFLARE_ACCESS_CLIENT_ID" \
            --header "CF-Access-Client-Secret: $CLOUDFLARE_ACCESS_CLIENT_SECRET" \
            --header "X-GitHub-Event: push" \
            --header "Content-Type: application/json" \
            --data "$payload" \
            "$DOKPLOY_DEPLOY_URL"
