name: CI/CD Pipeline

on:
  pull_request:
    branches: [main, 'feat/**']
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Validation, tests et build Docker
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate PR title (Conventional Commits)
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          CONVENTIONAL_REGEX="^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9_.-]+\))?!?: .+"
          if ! echo "$PR_TITLE" | grep -qE "$CONVENTIONAL_REGEX"; then
            echo "❌ PR title does not follow Conventional Commits format:" >&2
            echo "   '$PR_TITLE'" >&2
            echo "Expected: <type>(<scope>): <description> (e.g. docs(brand): add logo assets)" >&2
            exit 1
          fi
          echo "✅ PR title follows Conventional Commits: '$PR_TITLE'"

      - name: Run CI pipeline with Dagger
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: '0.21.11'
          verb: call
          args: check --export-artifacts=true
        env:
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false
          verbose: false

  auto-merge:
    name: Auto-merge PR
    needs: [check]
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      merged: ${{ steps.merge.outputs.merged }}
    steps:
      - name: Merge pull request
        id: merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          if gh pr merge "$PR_URL" --squash --delete-branch; then
            echo "merged=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Automatic squash-merge could not be performed by GITHUB_TOKEN (typically because workflow files were modified, which requires administrator privileges). Please merge manually."
            echo "merged=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Déploiement en production via Dokploy
    needs: [check, auto-merge]
    if: >-
      always() &&
      needs.check.result == 'success' &&
      (
        (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) ||
        (needs.auto-merge.result == 'success' && needs.auto-merge.outputs.merged == 'true')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Déclencher le webhook Dokploy
        env:
          DOKPLOY_DEPLOY_URL: ${{ secrets.DOKPLOY_DEPLOY_URL }}
          CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
        run: |
          if [ -z "$DOKPLOY_DEPLOY_URL" ]; then
            echo "::warning::DOKPLOY_DEPLOY_URL n'est pas encore configuré dans l'environnement 'production'. Étape de webhook ignorée jusqu'à configuration des secrets."
            exit 0
          fi

          deploy_token="${DOKPLOY_DEPLOY_URL##*/}"
          echo "::add-mask::$deploy_token"

          # Enforce https:// scheme to avoid Cloudflare HTTP-to-HTTPS 301 redirect
          dokploy_url="$(echo -n "$DOKPLOY_DEPLOY_URL" | xargs)"
          target_url="${dokploy_url/#http:\/\//https://}"

          payload=$(jq -nc \
            --arg ref "refs/heads/main" \
            --arg sha "$GITHUB_SHA" \
            '{ref: $ref, head_commit: {id: $sha, message: "CI passed"}, commits: []}')

          http_code=$(curl --silent --show-error --location --post301 --post302 --write-out "%{http_code}" \
            --output /tmp/dokploy_response.json \
            --request POST \
            --header "CF-Access-Client-Id: $CLOUDFLARE_ACCESS_CLIENT_ID" \
            --header "CF-Access-Client-Secret: $CLOUDFLARE_ACCESS_CLIENT_SECRET" \
            --header "X-GitHub-Event: push" \
            --header "Content-Type: application/json" \
            --data "$payload" \
            "$target_url")

          echo "Dokploy HTTP response code: $http_code"
          cat /tmp/dokploy_response.json || true
          echo ""

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::Dokploy deployment trigger failed with HTTP $http_code"
            exit 1
          fi
