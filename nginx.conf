worker_processes auto;
pid /tmp/nginx.pid;

error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  types {
    text/markdown md;
  }
  default_type application/octet-stream;
  access_log /dev/stdout;
  server_tokens off;

  # Character set
  charset utf-8;
  charset_types text/markdown text/plain text/css application/json application/javascript;

  # Performance tweaks
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/markdown text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

  # Agent Content Negotiation
  map $http_accept $wants_markdown {
    default 0;
    ~*text/markdown 1;
  }

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Suppress internal port, host and protocol leakage in redirections
    absolute_redirect off;
    port_in_redirect off;
    server_name_in_redirect off;

    # Healthcheck endpoint for Docker / Dokploy / Traefik
    location = /healthz {
      access_log off;
      add_header Content-Type text/plain;
      return 200 "healthy\n";
    }

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Root route with Agent Conneg
    location = / {
      if ($wants_markdown = 1) {
        rewrite ^ /llms.txt break;
      }
      add_header Cache-Control "public, max-age=60, stale-while-revalidate=300";
      try_files /index.html =404;
    }

    # Tool routes with Agent Conneg & Trailing Slash handling
    location ~ ^/tools/(?<tool_id>[^/]+)/?$ {
      if ($wants_markdown = 1) {
        rewrite ^ /tools/$tool_id.md break;
      }
      add_header Cache-Control "public, max-age=60, stale-while-revalidate=300";
      try_files $uri $uri/ $uri/index.html /index.html =404;
    }

    # Manifesto route with Agent Conneg
    location ~ ^/manifesto/?$ {
      if ($wants_markdown = 1) {
        rewrite ^ /manifesto.md break;
      }
      add_header Cache-Control "public, max-age=60, stale-while-revalidate=300";
      try_files $uri $uri/ $uri/index.html /index.html =404;
    }

    # Machine-readable discovery files and markdown
    location ~* \.(?:md|txt|json)$ {
      add_header Cache-Control "public, max-age=3600";
      try_files $uri =404;
    }

    # Hashed static assets (Astro output in /_astro/)
    location ^~ /_astro/ {
      expires 1y;
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    # Self-hosted Web Fonts (WOFF2, WOFF) - Unhashed static assets
    location ~* \.(?:woff2?|ttf|otf|eot)$ {
      expires 1y;
      add_header Cache-Control "public, max-age=31536000";
      add_header Access-Control-Allow-Origin "*";
      try_files $uri =404;
    }

    # Brand assets and images
    location ~* \.(?:svg|png|jpg|jpeg|gif|webp|avif|ico)$ {
      expires 30d;
      add_header Cache-Control "public, max-age=2592000";
      try_files $uri =404;
    }

    # Clean URLs & Astro routing fallback
    location / {
      add_header Cache-Control "public, max-age=60, stale-while-revalidate=300";
      try_files $uri $uri/ $uri/index.html /index.html =404;
    }

    error_page 404 /index.html;
  }
}
