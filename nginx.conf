worker_processes auto;
pid /tmp/nginx.pid;

error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  server_tokens off;

  # Performance tweaks
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Healthcheck endpoint for Docker / Dokploy / Traefik
    location = /healthz {
      access_log off;
      add_header Content-Type text/plain;
      return 200 "healthy\n";
    }

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Hashed static assets (Astro output in /_astro/)
    location ^~ /_astro/ {
      expires 1y;
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    # Brand assets and images
    location ~* \.(?:svg|png|jpg|jpeg|gif|webp|ico)$ {
      expires 7d;
      add_header Cache-Control "public, max-age=604800";
      try_files $uri =404;
    }

    # Clean URLs & Astro routing
    location / {
      add_header Cache-Control "public, max-age=0, must-revalidate";
      try_files $uri $uri/ $uri/index.html /index.html =404;
    }

    error_page 404 /index.html;
  }
}
